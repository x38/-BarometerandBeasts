
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fauna & Flora Pictures</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7f0;
            color: #333;
        }

        /* Website Header */
        header {
            background-color: #234d32;
            color: white;
            text-align: center;
            padding: 35px;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
        }

        header p {
            margin-bottom: 0;
            font-size: 16px;
        }

/* Navigation Bar */
nav {
    background-color: #376b47;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
}

.dropdown {
    position: relative;
    display: inline-block;
}

.dropbtn {
    background-color: #376b47;
    color: white;
    padding: 16px 25px;
    font-size: 17px;
    border: none;
    cursor: pointer;
}

.dropbtn:hover {
    background-color: #234d32;
}

.dropdown-content {
    display: none;
    position: absolute;
    background-color: white;
    min-width: 220px;
    box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
    z-index: 10;
    text-align: left;
}

.dropdown-content a {
    color: #333;
    padding: 14px 16px;
    text-decoration: none;
    display: block;
}

.dropdown-content a:hover {
    background-color: #e4eee2;
}

.dropdown:hover .dropdown-content {
    display: block;
}

/* Search bar positioning */
.search-container {
    display: flex;
    align-items: center;
    margin-left: auto;
}

        /* Main Content */
        main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 20px;
        }

        main > h2 {
            text-align: center;
            color: #234d32;
        }

        main > p {
            text-align: center;
            margin-bottom: 35px;
        }

        /* Gallery Section */
        .gallery-section {
            background-color: white;
            border: 3px solid #376b47;
            border-radius: 10px;
            padding: 18px;
            margin: 25px auto;
            display: flex;
            gap: 25px;
            align-items: center;
            max-width: 950px;
            box-shadow: 0px 3px 8px rgba(0,0,0,0.08);
        }

        /* Slideshow Side */
        .slideshow {
            width: 60%;
            flex-shrink: 0;
            position: relative;
            background-color: #234d32;
            border: 3px solid #234d32;
            border-radius: 8px;
            overflow: hidden;
        }

        .slide {
            display: none;
        }

        .slide.active {
            display: block;
        }

        .slide img {
            width: 100%;
            height: 330px;
            object-fit: contain;
            background-color: #234d32;
            display: block;
        }

        /* Arrows */
        .prev, .next {
            position: absolute;
            top: 43%;
            cursor: pointer;
            padding: 10px 14px;
            background-color: rgba(0,0,0,0.45);
            color: white;
            border: none;
            font-size: 23px;
            border-radius: 5px;
        }

        .prev {
            left: 10px;
        }

        .next {
            right: 10px;
        }

        .prev:hover, .next:hover {
            background-color: rgba(0,0,0,0.8);
        }

        /* White Indicator Dots */
        .dots {
            text-align: center;
            padding: 12px 5px;
            background-color: #234d32;
        }

        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid white;
            border-radius: 50%;
            margin: 0 4px;
            cursor: pointer;
            background-color: transparent;
        }

        .dot.active {
            background-color: white;
        }

        .dot:hover {
            background-color: white;
        }

        /* Description Side */
        .description {
            width: 40%;
            padding: 10px;
        }

        .description h3 {
            color: #234d32;
            margin-top: 0;
            font-size: 22px;
        }

        .description p {
            line-height: 1.7;
            font-size: 16px;
        }

        /* Footer */
        footer {
            background-color: #234d32;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 60px;
        }

        /* Mobile Layout */
        @media (max-width: 700px) {

            main {
                padding: 10px;
            }

            .gallery-section {
                flex-direction: column;
                gap: 15px;
                padding: 12px;
            }

            .slideshow {
                width: 100%;
            }

            .slide img {
                height: 270px;
            }

            .description {
                width: 100%;
                padding: 5px;
            }

            .description h3 {
                text-align: center;
            }

            header h1 {
                font-size: 30px;
            }
        }
        .search-container {
    position: relative;
    display: flex;
    align-items: center;
}

.search-container input {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 5px;
    width: 200px;
}

.search-container button {
    padding: 8px 12px;
    cursor: pointer;
    border: none;
    border-radius: 5px;
    background-color: #234d32;
    color: white;
}

#searchResults {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    background: white;
    width: 300px;
    max-height: 300px;
    overflow-y: auto;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    border-radius: 5px;
    z-index: 1000;
}

#searchResults a {
    display: block;
    padding: 10px;
    color: #234d32;
    text-decoration: none;
}

#searchResults a:hover {
    background-color: #f0f0f0;
}
    </style>
</head>

<body>

    <header>
        <h1>Nature & Weather Blog</h1>
        <p>Weather, Wildlife, Plants, and Other News</p>
    </header>

    <nav>
        <div class="dropdown">
            <button class="dropbtn">Menu ▼</button>

            <div class="dropdown-content">
                <a href="index.html">Home</a>
                <a href="weather.html">Weather Outlook</a>
                <a href="pictures.html">Fauna & Flora Pictures</a>
                <a href="news.html">Other News</a>
            </div>
        </div>
        <div class="search-container">
    <input type="text" id="searchInput"
           placeholder="Search website..."
           autocomplete="off">

    <button type="button" onclick="searchWebsite()">🔍</button>

    <div id="searchResults"></div>
</div>
    </nav>

    <main>

        <h2>Fauna & Flora Pictures</h2>

        <p>
            A collection of photographs showcasing the beauty
            of wildlife, plants, and the natural world.
        </p>

        <!-- Gallery sections are generated below -->

        <div id="gallery-container"></div>

    </main>

    <footer>
        <p>&copy; 2026 Nature & Weather Blog</p>
    </footer>

    <script>

        /* ==========================================
           GALLERY SETUP

           Change image filenames and descriptions here.
           Each gallery contains exactly 5 images
           ========================================== */

        const galleries = [

            {
                title: "Friendly Heron",
                description: "A friendly Great Blue Heron at Elm Park in Worcester, Massachusetts. Usually Blue Herons are shy birds though this one is likely accustomed to fellow humans at the park so it didn't mind coming up close and inquiring any fishy treats! (© Sergio Troiani)",
images: [
    "images/heron1.jpg",
    "images/heron2.jpg",
    "images/heron3.jpg",
    "images/heron4.jpg",
    "images/heron5.jpg"
]
            },

            {
                title: "Sharp Sighted Hawk",
                description: "Hawk at our little pond outfront was hunting for a rodent and swoop! it went down and picked up its prey before eating its catch on another branch. (© Sergio Troiani)",
                images: [
                    "images/redshoulderedhawk.png",
                    "images/redshoulderedhawk2.png",
                    "images/redshoulderedhawk3.png",
                ]
            },

            {
                title: "Gallery 3",
                description: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vivamus vitae sem at neque consequat aliquam. Sed ornare, ligula vel suscipit malesuada, neque ipsum feugiat erat, vitae commodo magna lorem sed ipsum.",
                images: [
                    "images/gallery3-1.jpg",
                    "images/gallery3-2.jpg",
                    "images/gallery3-3.jpg",
                    "images/gallery3-4.jpg",
                    "images/gallery3-5.jpg"
                ]
            },

            {
                title: "Gallery 4",
                description: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vivamus vitae sem at neque consequat aliquam. Sed ornare, ligula vel suscipit malesuada, neque ipsum feugiat erat, vitae commodo magna lorem sed ipsum.",
                images: [
                    "images/gallery4-1.jpg",
                    "images/gallery4-2.jpg",
                    "images/gallery4-3.jpg",
                    "images/gallery4-4.jpg",
                    "images/gallery4-5.jpg"
                ]
            },

            {
                title: "Gallery 5",
                description: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vivamus vitae sem at neque consequat aliquam. Sed ornare, ligula vel suscipit malesuada, neque ipsum feugiat erat, vitae commodo magna lorem sed ipsum.",
                images: [
                    "images/gallery5-1.jpg",
                    "images/gallery5-2.jpg",
                    "images/gallery5-3.jpg",
                    "images/gallery5-4.jpg",
                    "images/gallery5-5.jpg"
                ]
            }

        ];

        /* ==========================================
           CREATE THE GALLERIES
           ========================================== */

        const container = document.getElementById("gallery-container");

        galleries.forEach((gallery, galleryIndex) => {

            const section = document.createElement("section");
            section.className = "gallery-section";

            let slidesHTML = "";
            let dotsHTML = "";

            gallery.images.forEach((image, imageIndex) => {

                slidesHTML += `
                    <div class="slide ${imageIndex === 0 ? "active" : ""}">
                        <img src="${image}"
                             alt="${gallery.title} picture ${imageIndex + 1}">
                    </div>
                `;

                dotsHTML += `
                    <span class="dot ${imageIndex === 0 ? "active" : ""}"
                          data-slide="${imageIndex}">
                    </span>
                `;
            });

            section.innerHTML = `
                <div class="slideshow">

                    ${slidesHTML}

                    <button class="prev"
                            aria-label="Previous image">&#10094;</button>

                    <button class="next"
                            aria-label="Next image">&#10095;</button>

                    <div class="dots">
                        ${dotsHTML}
                    </div>

                </div>

                <div class="description">
                    <h3>${gallery.title}</h3>
                    <p>${gallery.description}</p>
                </div>
            `;

            container.appendChild(section);

            /* ==========================================
               SLIDESHOW CONTROLS
               ========================================== */

            const slides = section.querySelectorAll(".slide");
            const dots = section.querySelectorAll(".dot");

            let currentSlide = 0;
            let timer;

            function showSlide(index) {

                currentSlide = index;

                if (currentSlide >= slides.length) {
                    currentSlide = 0;
                }

                if (currentSlide < 0) {
                    currentSlide = slides.length - 1;
                }

                slides.forEach(slide => {
                    slide.classList.remove("active");
                });

                dots.forEach(dot => {
                    dot.classList.remove("active");
                });

                slides[currentSlide].classList.add("active");
                dots[currentSlide].classList.add("active");

                resetTimer();
            }

            function nextSlide() {
                showSlide(currentSlide + 1);
            }

            function previousSlide() {
                showSlide(currentSlide - 1);
            }

            function startTimer() {
                timer = setInterval(nextSlide, 25000);
            }

            function resetTimer() {
                clearInterval(timer);
                startTimer();
            }

            section.querySelector(".next").addEventListener("click", nextSlide);
            section.querySelector(".prev").addEventListener("click", previousSlide);

            dots.forEach((dot, index) => {
                dot.addEventListener("click", () => {
                    showSlide(index);
                });
            });

            startTimer();

            /* ==========================================
               MOBILE SWIPE SUPPORT
               ========================================== */

            let touchStartX = 0;
            let touchEndX = 0;

            const slideshow = section.querySelector(".slideshow");

            slideshow.addEventListener("touchstart", event => {
                touchStartX = event.changedTouches[0].screenX;
            });

            slideshow.addEventListener("touchend", event => {
                touchEndX = event.changedTouches[0].screenX;

                const distance = touchEndX - touchStartX;

                if (distance < -50) {
                    nextSlide();
                }

                if (distance > 50) {
                    previousSlide();
                }
            });

        });

    </script>
<script>
function highlightSearchTerm() {
    const params = new URLSearchParams(window.location.search);
    const searchTerm = params.get("search");

    if (!searchTerm) return;

    const walker = document.createTreeWalker(
        document.body,
        NodeFilter.SHOW_TEXT
    );

    const textNodes = [];

    while (walker.nextNode()) {
        const node = walker.currentNode;

        if (
            node.parentElement.closest("script, style, input, button, nav, footer")
        ) {
            continue;
        }

        if (node.textContent.toLowerCase().includes(searchTerm.toLowerCase())) {
            textNodes.push(node);
        }
    }

    textNodes.forEach(node => {
        const text = node.textContent;
        const regex = new RegExp(
            searchTerm.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"),
            "gi"
        );

        const fragment = document.createDocumentFragment();
        let lastIndex = 0;
        let match;

        while ((match = regex.exec(text)) !== null) {
            fragment.appendChild(
                document.createTextNode(text.substring(lastIndex, match.index))
            );

            const mark = document.createElement("mark");
            mark.textContent = match[0];
            mark.style.backgroundColor = "yellow";
            mark.style.color = "black";
            mark.style.padding = "2px";

            fragment.appendChild(mark);
            lastIndex = regex.lastIndex;
        }

        fragment.appendChild(document.createTextNode(text.substring(lastIndex)));
        node.parentNode.replaceChild(fragment, node);
    });

    const firstMatch = document.querySelector("mark");

    if (firstMatch) {
        firstMatch.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });
    }
}

window.addEventListener("load", highlightSearchTerm);
</script>
    <script>
const websitePages = [
    { title: "Home", url: "index.html" },
    { title: "Weather Outlook", url: "weather.html" },
    { title: "Fauna & Flora Pictures", url: "pictures.html" },
    { title: "Other News", url: "news.html" }
];

async function searchWebsite() {
    const input = document.getElementById("searchInput");
    const results = document.getElementById("searchResults");
    const query = input.value.trim();

    results.innerHTML = "";
    results.style.display = "block";

    if (!query) {
        results.innerHTML = "<p>Please enter a search term.</p>";
        return;
    }

    let foundResults = [];

    for (const page of websitePages) {
        try {
            const response = await fetch(page.url);
            const html = await response.text();

            const doc = new DOMParser().parseFromString(html, "text/html");
            const text = doc.body.innerText.toLowerCase();

            if (text.includes(query.toLowerCase())) {
                foundResults.push(page);
            }
        } catch (error) {
            console.error("Error searching:", page.url, error);
        }
    }

    if (foundResults.length === 0) {
        results.innerHTML = "<p>No results found.</p>";
        return;
    }

    foundResults.forEach(page => {
        const link = document.createElement("a");

        link.href = page.url + "?search=" + encodeURIComponent(query);
        link.textContent = page.title;

        results.appendChild(link);
    });
}

document.getElementById("searchInput").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        searchWebsite();
    }
});

document.addEventListener("click", function(event) {
    const container = document.querySelector(".search-container");

    if (container && !container.contains(event.target)) {
        document.getElementById("searchResults").style.display = "none";
    }
});
</script>
